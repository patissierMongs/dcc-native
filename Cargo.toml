[package]
name = "dcc"
version = "0.2.0"
edition = "2021"
description = "DevOps Command Center: a live, clickable terminal-style dashboard that replaces the Windows desktop wallpaper"
license = "MIT"
repository = "https://github.com/patissierMongs/dcc-native"
readme = "README.md"
keywords = ["wallpaper", "dashboard", "windows", "monitoring", "desktop"]
publish = false

[dependencies]
windows-core = "0.62"

[dependencies.windows]
version = "0.62.2"
features = [
    "Win32_System_EventLog",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinHttp",
    "Win32_System_Time",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
